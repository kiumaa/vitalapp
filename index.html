<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitalAPP Prototype</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root" class="min-h-screen"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [currentScreen, setCurrentScreen] = useState('splash');

        useEffect(() => {
          const timer = setTimeout(() => setCurrentScreen('home'), 2000);
          return () => clearTimeout(timer);
        }, []);

        if (currentScreen === 'splash') {
          return (
            <div className="flex items-center justify-center min-h-screen">
              <h1 className="text-4xl font-thin">VitalAPP</h1>
            </div>
          );
        }

        return (
          <div className="p-4">
            <h1 className="text-2xl mb-4">Prototipo VitalAPP</h1>
            <p>Bem-vindo! Este é um protótipo React simples.</p>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
